<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jcreate++</title>
  </head>
  <body>
    <div id="app">
      <header id="headerBar">
        <h1>Jcreate++</h1>
        <div id="toolbar">
          <label class="filenameField">
            JSファイル名
            <input id="scriptFileName" type="text" value="jcreateplus_script.js" aria-label="保存するJSファイル名" />
          </label>
          <button id="btnDownloadJS" title="Unity の Scriptable Item に設定する .js ファイルを保存します">JS保存（Unity用）</button>
          <label class="filenameField">
            ブロックのファイル名
            <input id="workspaceFileName" type="text" value="jcreateplus_workspace.json" aria-label="保存するブロックのファイル名" />
          </label>
          <button id="btnSave" title="ブロックの並びを .json に保存します（あとで「ブロックを開く」で続きを作れます。Unity には入れません）">ブロック保存</button>
          <button id="btnLoad" title="「ブロック保存」で保存した .json を開きます">ブロックを開く</button>
          <button id="btnClear" title="置いたブロックをすべて消去">すべてクリア</button>
        </div>
      </header>
      <div id="mainContainer">
        <div id="blocklyDiv"></div>
        <div id="codePane">
          <div id="paneTabs" role="tablist">
            <button id="tabCode" role="tab" aria-selected="true">生成コード</button>
            <button id="tabPreview" role="tab" aria-selected="false">3Dプレビュー</button>
          </div>
          <div id="codeView">
            <div id="startHint">
              <p><strong>はじめての人へ</strong></p>
              <ol>
                <li>左の「イベント」から <b>インタラクト時</b> を真ん中に置く</li>
                <li>「動作」から <b>位置を … ずつ変える</b> を、その中に入れる</li>
                <li>上の「3Dプレビュー」で動きを確かめる</li>
              </ol>
              <p><a href="../recipes/" target="_blank" rel="noopener">レシピ集</a> ・ <a href="../first-unity" target="_blank" rel="noopener">はじめて Unity で動かす</a></p>
            </div>
            <div id="errorMessages" style="display: none;"></div>
            <div id="unityRequirements" style="display: none;"></div>
            <div id="scriptSize" style="display: none;"></div>
            <pre id="generatedCode"><code>// ブロックを置くと、ここにコードが出ます</code></pre>
          </div>
          <div id="previewView" hidden></div>
        </div>
      </div>
    </div>
  </body>
</html>
